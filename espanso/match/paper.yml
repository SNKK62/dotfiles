matches:
  - trigger: ";cvpr"
    replace: '"$|$" site:openaccess.thecvf.com/content/CVPR2025/papers filetype:pdf'
  - trigger: ";iccv"
    replace: '"$|$" site:openaccess.thecvf.com/content/ICCV2025/papers filetype:pdf'
  - trigger: ";eccv"
    replace: '"$|$" inurl:eccv_2024 "Proceedings of the European Conference on Computer Vision (ECCV)" filetype:pdf'
  - trigger: ";iclr"
    replace: '"$|$" "ICLR 2025" site:openreview.net filetype:pdf -"Under review" -"Submitted to ICLR"'
  - trigger: ";icml"
    replace: '"$|$" "International Conference on Machine Learning"site:proceedings.mlr.press filetype:pdf'
  - trigger: ";neurips"
    replace: '"$|$" neurips2025 openreview filetype:pdf'
  - trigger: ";corl"
    replace: '"$|$" corl2025 openreview filetype:pdf -"Anonymous"'
  - trigger: ";rss"
    replace: '"$|$" "2025" Robotics: Science and Systems" site:roboticsproceedings.org filetype:pdf'
  - trigger: ";gdoc"
    replace: |
      google docsにまとめられるように，それぞれの論文について，タイトル，採択会議，arxiv/openreview/etc へのリンク，社会的意義，軽い説明，新規性，問題設定，計算機要件，訓練時間 をまとめて列挙してください．
